[package]
name = "ffone-client"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish = false
autoexamples = false

[features]
# Visual/performance diagnostics are not ordinary example/build prerequisites.
diagnostics = []
default = []
# Development-only Bevy DLL. Release/package commands intentionally do not
# enable it, so shipped executables stay self-contained.
dev-dynamic = ["bevy/dynamic_linking"]
# Opt-in system/render span capture for performance investigations. This is
# deliberately outside the default and release feature sets: it records the
# existing frame instead of changing scene content or presentation settings.
profiling = ["bevy/trace_chrome"]

[dependencies]
bevy.workspace = true
# Editor caret/selection geometry uses the same shaper as Bevy text.
parley = "=0.9.0"
csv = "~1.3.1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
arboard = { version = "3.6.1", default-features = false }
tempfile = "3"
blake3 = "1.8"
ffone-client-foundation = { path = "../ffone-client-foundation" }
ffone-client-network = { path = "../ffone-client-network" }
ffone-net = { path = "../ffone-net" }
ffone-protocol = { path = "../ffone-protocol" }
ffone-runtime-contracts = { path = "../ffone-runtime-contracts" }
ffone-skinned-model = { path = "../ffone-skinned-model" }
ffone-tutorial-core = { path = "../ffone-tutorial-core" }
ffone-ui-layout = { path = "../ffone-ui-layout" }
image = { version = "0.25.10", default-features = false, features = ["ico", "png"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"

[target.'cfg(windows)'.dependencies]
rfd = { version = "0.15.4", default-features = false }
bevy_winit = "=0.19.1"
winit = "0.30.13"
winsafe = { version = "0.0.28", features = ["user"] }

[dev-dependencies]
gltf = { version = "1.4.1", default-features = false, features = ["utils"] }
tempfile = "3"

[build-dependencies]
winresource = "0.1"

[lints]
workspace = true


